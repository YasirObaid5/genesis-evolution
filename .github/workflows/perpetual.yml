# Resumes the perpetual water-column world, evolves it, and publishes the new state
# to the `perpetual-data` branch (a single force-pushed commit, so the repo does not grow).
name: perpetual-world

on:
  schedule:
    - cron: '17 */3 * * *'        # every 3 hours (UTC)
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes of simulation in this run'
        default: '40'

permissions:
  contents: write

concurrency:
  group: genesis-data             # never run two writers at once
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch the saved world
        run: bash runner/fetch-data.sh
      - name: Evolve
        run: MINUTES=${{ github.event.inputs.minutes || '40' }} DATA_DIR=data node runner/perpetual.mjs
      - name: Publish the new state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash runner/publish-data.sh "world update"
